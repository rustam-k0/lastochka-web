services:
  lastochka:
    build:
      context: .
    container_name: lastochka-web
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - lastochka-sessions:/app/.data
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_BASE_URL: https://lastochki.store/api/v1
      DEFAULT_STORE_ID: 2
      PUBLIC_ORIGIN: https://lastochka.duckdns.org
      SESSION_DB_PATH: /app/.data/sessions.sqlite
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      ALLOWED_PAYMENT_RETURN_URL: ${ALLOWED_PAYMENT_RETURN_URL:-https://lastochki.store}

  caddy:
    image: caddy:2-alpine
    container_name: lastochka-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lastochka

volumes:
  lastochka-sessions:
  caddy-data:
  caddy-config:
